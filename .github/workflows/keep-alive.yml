name: Keep Render service awake

# Render's free plan spins a web service down after 15 minutes of no
# incoming requests, and the next visitor eats a ~30-50s cold start. Pinging
# /health every 10 minutes keeps it warm.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> New repository
# secret -> name it RENDER_URL, value your deployed URL with no trailing
# slash (e.g. https://profa-eficienta-waitlist.onrender.com).
#
# Known limitation: GitHub disables scheduled workflows automatically after
# 60 days with no repository activity (any commit/push resets the clock).
# If pings stop arriving, re-push anything or click "Run workflow" below.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "RENDER_URL secret is not set — see the comment at the top of this file." >&2
            exit 1
          fi
          curl -fsS --max-time 20 "${{ secrets.RENDER_URL }}/health" && echo "OK"
